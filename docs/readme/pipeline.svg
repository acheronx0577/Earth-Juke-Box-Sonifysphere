<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <rect width="980" height="420" fill="#0d1117"/>
  <style>
    .t { font-family: "Geist Mono", ui-monospace, monospace; fill: #fff3ea; }
    .l { font-family: "Geist Mono", ui-monospace, monospace; fill: rgba(255,243,234,0.62); }
    .box { fill: #161b22; stroke: rgba(255,243,234,0.22); stroke-width: 1; }
    .line { stroke: rgba(255,243,234,0.35); stroke-width: 1.25; fill: none; }
  </style>
  <text class="l" x="24" y="32" font-size="12" letter-spacing="2">DATA FLOW  ·  SONIFYSPHERE</text>

  <rect class="box" x="24" y="170" width="150" height="80" rx="4"/>
  <text class="t" x="99" y="206" font-size="13" text-anchor="middle">Browser</text>
  <text class="l" x="99" y="226" font-size="10" text-anchor="middle">probe · listen</text>

  <line class="line" x1="174" y1="210" x2="230" y2="210"/>
  <polygon points="230,210 222,206 222,214" fill="rgba(255,243,234,0.5)"/>

  <rect class="box" x="230" y="160" width="200" height="100" rx="4"/>
  <text class="t" x="330" y="200" font-size="13" text-anchor="middle">Next.js API</text>
  <text class="l" x="330" y="220" font-size="10" text-anchor="middle">allowlisted proxies</text>
  <text class="l" x="330" y="236" font-size="10" text-anchor="middle">/api/listen/*</text>

  <line class="line" x1="430" y1="210" x2="500" y2="210"/>
  <polygon points="500,210 492,206 492,214" fill="rgba(255,243,234,0.5)"/>

  <!-- providers -->
  <rect class="box" x="500" y="40" width="220" height="52" rx="4"/>
  <text class="t" x="610" y="71" font-size="12" text-anchor="middle">NASA SVS / EIC</text>
  <text class="l" x="610" y="86" font-size="10" text-anchor="middle">5101  5196  3912  5011</text>

  <rect class="box" x="500" y="104" width="220" height="52" rx="4"/>
  <text class="t" x="610" y="135" font-size="12" text-anchor="middle">NASA GIBS · EPIC · EONET</text>
  <text class="l" x="610" y="150" font-size="10" text-anchor="middle">tiles · full-disc · events</text>

  <rect class="box" x="500" y="168" width="220" height="52" rx="4"/>
  <text class="t" x="610" y="199" font-size="12" text-anchor="middle">NASA POWER · NOAA GML</text>
  <text class="l" x="610" y="214" font-size="10" text-anchor="middle">fallback · Keeling CO₂</text>

  <rect class="box" x="500" y="232" width="220" height="52" rx="4"/>
  <text class="t" x="610" y="263" font-size="12" text-anchor="middle">Planetary Computer</text>
  <text class="l" x="610" y="278" font-size="10" text-anchor="middle">STAC point sampling</text>

  <rect class="box" x="500" y="296" width="220" height="52" rx="4"/>
  <text class="t" x="610" y="327" font-size="12" text-anchor="middle">Color-bar lookup</text>
  <text class="l" x="610" y="342" font-size="10" text-anchor="middle">°C  ·  ppm  ·  m/s</text>

  <line class="line" x1="720" y1="210" x2="790" y2="210"/>
  <polygon points="790,210 782,206 782,214" fill="rgba(255,243,234,0.5)"/>

  <rect class="box" x="790" y="160" width="166" height="100" rx="4"/>
  <text class="t" x="873" y="200" font-size="13" text-anchor="middle">Tone.js</text>
  <text class="l" x="873" y="220" font-size="10" text-anchor="middle">Web Audio API</text>
  <text class="l" x="873" y="236" font-size="10" text-anchor="middle">soundscape</text>

  <!-- vertical connectors from API to provider stack already implied by the mid line -->
  <line class="line" x1="500" y1="66" x2="466" y2="66"/>
  <line class="line" x1="466" y1="66" x2="466" y2="322"/>
  <line class="line" x1="466" y1="130" x2="500" y2="130"/>
  <line class="line" x1="466" y1="194" x2="500" y2="194"/>
  <line class="line" x1="466" y1="258" x2="500" y2="258"/>
  <line class="line" x1="466" y1="322" x2="500" y2="322"/>
  <line class="line" x1="430" y1="210" x2="466" y2="210"/>
</svg>
